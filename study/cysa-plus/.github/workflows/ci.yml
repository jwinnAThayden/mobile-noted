name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      - name: Generated files are up to date
        # A stale content.json ships the wrong notes to every installed app,
        # and a stale service-worker stamp stops the update reaching phones.
        run: |
          python build_offline_html.py
          python webapp/build_content.py
          git diff --exit-code -- cysa-offline.html webapp/static/content.json webapp/static/sw.js
