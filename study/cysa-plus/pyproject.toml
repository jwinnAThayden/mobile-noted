[project]
name = "cysa-plus-study"
version = "1.0.0"
description = "Offline CompTIA CySA+ (CS0-003) study pack and installable study app"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = [".", "webapp"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = ["webapp/static", "audio"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # long lines are checked by the formatter, not the linter
    "SIM105", # contextlib.suppress is not clearer here
]

[tool.ruff.format]
quote-style = "double"
